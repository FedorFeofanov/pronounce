<!DOCTYPE html>
<html data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Pronounce</title>
    <link rel="stylesheet" href="../static/css/index/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h2 class="display-3 text-center">{{ word }}</h2>

    <div class="container">
      <div class="row text-center">
        <div class="btn-group" role="group" aria-label="Button group">
          <button class="btn btn-outline-primary" onclick="playAudioUK()">Play UK Audio</button>
          <audio id="audioUK">
          <source src="https://dictionary.cambridge.org/{{ audio_uk }}" type="audio/ogg">
          Your browser does not support the audio element.
          </audio>

          <button class="btn btn-outline-primary" onclick="playAudioUS()">Play US Audio</button>
          <audio id="audioUS">
          <source src="https://dictionary.cambridge.org/{{ audio_us }}" type="audio/ogg">
          Your browser does not support the audio element.
          </audio>
        </div>
      </div>
    <div class="row text-center">
      <div class="col">
        <h3 class="display-5 text-center fw-italic">UK: /{{ ipa_uk }}/</h3>
      </div>
      <div class="col">
        <h3 class="display-5 text-center fw-italic">US: /{{ ipa_us }}/</h3>
      </div>
    </div>
    <div class="row text-center">
      <div class="col">
        <h2 class="display-4" id="user_pronounciation"></h2>
      </div>
    </div>
    
    <div class="row text-center justify-content-center">
      <div class="col-4">
        <div class="d-grid gap-2">
          <button class="btn btn-outline-info btn-lg py-5 px-5 w-auto fs-2" type="button" id="mic-btn">🎙️</button>
        </div>
      </div>
    </div>

  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../static/js/index/script.js"></script>
  </body>
</html>
