<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Pronounce</title>
  </head>
  <body>
    <h2 style="display: inline;">{{ word }}</h2>

    <button onclick="playAudioUK()">Play Audio</button>
    <button onclick="pauseAudioUK()">Pause Audio</button>
    <audio id="audioUK">
    <source src="https://dictionary.cambridge.org/{{ audio_uk }}" type="audio/ogg">
    Your browser does not support the audio element.
    </audio>

    <button onclick="playAudioUS()">Play Audio</button>
    <button onclick="pauseAudioUS()">Pause Audio</button>
    <audio id="audioUS">
    <source src="https://dictionary.cambridge.org/{{ audio_us }}" type="audio/ogg">
    Your browser does not support the audio element.
    </audio>

    <h3>UK: /{{ ipa_uk }}/</h3>
    <h3>US: /{{ ipa_us }}/</h3>
    <h2 id="user_pronounciation"></h2>
    
    <button type="button" id="mic-btn" style="width: 300px; height: 200px;">🎙️</button>

    <script>
      let mediaRecorder;
      let audioChunks = [];
      const micBtn = document.getElementById('mic-btn');

      async function startRecording(){
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
          };

          mediaRecorder.start();
          console.log("Recording started...");
        } catch (err) {
          alert("Mic Error: " + err.name);
          console.error("Mic access denied or error:", err);
        }
      }

      async function stopRecording(){
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
          console.log("Recording stopped.");

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('recording', audioBlob, 'recording.wav');

            try {
              const response = await fetch('/post_audio', {
                method: 'POST',
                body: formData
              });
              if (response.ok){
                const data = await response.json();
                document.getElementById('user_pronounciation').innerText = data.output;
              } else {
                document.getElementById('user_pronounciation').innerText = "server error :(";
              }
              console.log("Sent to server successfully");
            } catch (err) {
              console.error("Error sending to server:", err);
            }
          };
        }
      }

      micBtn.addEventListener('mousedown', startRecording);
      micBtn.addEventListener('touchstart', startRecording);
      
      micBtn.addEventListener('mouseup', stopRecording);
      micBtn.addEventListener('touchend', stopRecording);


        function playAudioUK() {
        document.getElementById("audioUK").play();
        }
        function pauseAudioUK() {
        document.getElementById("audioUK").pause();
        }

        function playAudioUS() {
        document.getElementById("audioUS").play();
        }
        function pauseAudioUS() {
        document.getElementById("audioUS").pause();
        }
        
    </script>
  </body>
  <style>
  #mic-btn {
      -webkit-touch-callout: none; /* iOS Safari */
      -webkit-user-select: none;   /* Safari */
      user-select: none;           /* Standard */
      touch-action: manipulation;  /* Prevents double-tap zoom */
  }
  </style>
</html>
